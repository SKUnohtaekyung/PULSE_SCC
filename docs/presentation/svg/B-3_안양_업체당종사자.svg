 font-weight="700" fill="#14171D">이것이 뜻하는 것</text><text x="128.6" y="881.3" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21.5" font-weight="400" fill="#5C6675">사장님이 직접 주방에 서 있는 1~2인 매장이 대부분이다.</text><text x="128.6" y="917.8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21.5" font-weight="400" fill="#5C6675">마케팅에 쓸 사람도, 시간도 따로 없다.</text><rect x="1099.3" y="777.6" width="724.7" height="176.6" rx="13.44" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="1131.9" y="835.2" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22.1" font-weight="700" fill="#14171D">그래서 필요한 것</text><text x="1131.9" y="881.3" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21.5" font-weight="400" fill="#5C6675">사장님이 새로 만들 자료가 없어야 한다.</text><text x="1131.9" y="917.8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21.5" font-weight="400" fill="#5C6675">이미 쌓인 공개 리뷰만으로 손님 이해와 다음 행동까지.</text><line x1="96.0" y1="980.2" x2="1824.0" y2="980.2" stroke="#D9DEE7" stroke-width="1"/><text x="96.0" y="1006.1" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17.7" font-weight="400" fill="#7E8899">통계청 전국사업체조사 안양시 집계분(국가승인통계 제210003호) KSIC 56 · 2024.12.31 기준</text><text x="96.0" y="1033.9" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17.7" font-weight="400" fill="#7E8899">업체당 종사자 수는 종사자수 ÷ 사업체수로 계산한 값이며 원자료에 공표된 수치가 아니다  |  명학역 일대 = 명학동 + 안양6동 + 안양7동 (711개 / 1,832명)</text></svg>