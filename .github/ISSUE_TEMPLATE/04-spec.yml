name: 기획 · 요구사항 변경
description: PRD 또는 디자인 원칙 변경 (role:product / role:design-system)
title: "[SPEC] "
labels: ["type:spec", "role:product"]
body:
  - type: markdown
    attributes:
      value: |
        요구사항의 정본은 `docs/product/PRD.md`, UI 원칙의 정본은 `docs/design/DESIGN_SYSTEM.md` 입니다.
        **코드를 먼저 바꾸고 문서를 나중에 맞추지 않습니다.** 여기서 먼저 확정합니다.

  - type: dropdown
    id: target
    attributes:
      label: 변경 대상 문서
      options:
        - "docs/product/PRD.md"
        - "docs/product/requirements/*"
        - "docs/design/DESIGN_SYSTEM.md"
        - "docs/architecture/ARCHITECTURE.md"
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: 해당 섹션 / 요구사항 ID
      placeholder: "PRD 9장 MVP Scope / FR-003"
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 현재 내용 → 바꿀 내용
      placeholder: |
        현재: 
        변경: 
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 변경 이유
      description: 근거(사용자 피드백, 데이터, 기술 제약, 팀 합의)를 함께 적습니다.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 진행 중인 이슈/PR 중 영향받는 것. 이미 구현된 코드와 충돌하는지 확인한 결과.
      placeholder: |
        영향받는 작업: #12, #15
        이미 구현된 코드와 충돌: 있음 / 없음 / 확인 안 함
    validations:
      required: true

  - type: dropdown
    id: adr
    attributes:
      label: ADR이 필요한가
      description: 되돌리기 어렵거나 여러 사람에게 영향을 주는 결정이면 ADR을 남깁니다.
      options:
        - "아니오"
        - "예 — docs/decisions/ 에 추가 필요"
    validations:
      required: true
