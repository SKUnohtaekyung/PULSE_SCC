name: 기능 작업
description: 새 기능 또는 기존 기능 변경 (role:feature)
title: "[FEAT] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        착수 전에 `AGENTS.md` 5장(소유 영역)과 `docs/product/PRD.md` 를 확인하세요.
        하나의 이슈 = 하나의 TASK = 하나의 브랜치 = 하나의 담당자입니다.

  - type: dropdown
    id: role
    attributes:
      label: 담당 역할
      options:
        - "role:feature — 화면·기능"
        - "role:design-system — 디자인 토큰·공용 컴포넌트"
        - "role:platform — 빌드·설정·CI"
        - "role:product — 요구사항"
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: 관련 요구사항 ID
      description: "PRD의 FR 번호. 없으면 먼저 [SPEC] 이슈로 요구사항을 확정하세요."
      placeholder: "FR-001"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 무엇을 왜 만드는가. 구현 방법이 아니라 목적을 씁니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 관찰 가능한 조건으로. Reviewer가 이 기준으로 PASS/FAIL을 판정합니다.
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 예상 수정 범위
      description: 건드릴 디렉터리/파일. **다른 역할의 소유 영역이 포함되면 여기에 반드시 적습니다.**
    validations:
      required: true

  - type: input
    id: blockers
    attributes:
      label: 선행 작업 / 블로커
      placeholder: "#12 완료 후 착수 가능 / 없음"

  - type: checkboxes
    id: preflight
    attributes:
      label: 착수 전 확인
      options:
        - label: PRD에서 관련 요구사항을 확인했다
          required: true
        - label: 이 작업의 수정 범위가 다른 진행 중 이슈와 같은 파일을 건드리지 않는다
          required: true
