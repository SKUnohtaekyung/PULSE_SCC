name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring:
    name: Spring test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/spring-api/*.gradle
            backend/spring-api/gradle/wrapper/gradle-wrapper.properties
      - name: Build and test
        run: |
          chmod +x backend/spring-api/gradlew
          backend/spring-api/gradlew -p backend/spring-api build --no-daemon

  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/python-analysis/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e "./backend/python-analysis[dev]"
      - name: Ruff lint
        run: python -m ruff check --no-cache backend/python-analysis
      - name: Ruff format check
        run: python -m ruff format --check --no-cache backend/python-analysis
      - name: Pytest
        run: python -m pytest backend/python-analysis

  frontend:
    name: Frontend static checks and Android export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend/mobile ci
      - name: Verify design tokens
        run: npm --prefix frontend/mobile run verify:tokens
      - name: Lint
        run: npm --prefix frontend/mobile run lint
      - name: Typecheck
        run: npm --prefix frontend/mobile run typecheck
      - name: Export Android bundle
        run: npm --prefix frontend/mobile run export:android
